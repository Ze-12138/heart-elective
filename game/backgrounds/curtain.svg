<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdcfd4"/>
      <stop offset="50%" stop-color="#c0c3c9"/>
      <stop offset="100%" stop-color="#b0b3ba"/>
    </linearGradient>
    <linearGradient id="foldDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9598a1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9598a1" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#9598a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e2e7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0e2e7" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#e0e2e7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3.4"/></filter>
  </defs>

  <!-- 帘身：上窄下略宽，下摆是一条平缓的弧，不是花边 -->
  <path d="M10 0
           L310 0
           L313 560
           C240 572 150 572 8 558
           Z"
        fill="url(#cloth)"/>

  <g filter="url(#soft)" opacity=".7">
    <rect x="26" y="0" width="18" height="568" fill="url(#foldDark)"/>
    <rect x="78" y="0" width="20" height="572" fill="url(#foldDark)"/>
    <rect x="134" y="0" width="17" height="570" fill="url(#foldDark)"/>
    <rect x="192" y="0" width="19" height="568" fill="url(#foldDark)"/>
    <rect x="250" y="0" width="16" height="564" fill="url(#foldDark)"/>
    <rect x="292" y="0" width="14" height="560" fill="url(#foldDark)"/>
  </g>

  <g filter="url(#soft)" opacity=".55">
    <rect x="52" y="0" width="11" height="570" fill="url(#foldLight)"/>
    <rect x="106" y="0" width="10" height="570" fill="url(#foldLight)"/>
    <rect x="163" y="0" width="11" height="570" fill="url(#foldLight)"/>
    <rect x="221" y="0" width="10" height="566" fill="url(#foldLight)"/>
    <rect x="272" y="0" width="9" height="562" fill="url(#foldLight)"/>
  </g>

  <!-- 下摆厚度 -->
  <path d="M8 545
           C150 562 240 562 313 548
           L313 560
           C240 572 150 572 8 558
           Z"
        fill="#9a9da6" opacity=".5" filter="url(#soft)"/>
</svg>
