<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>睡觉场景对比 · 心动选修课</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f0e6; }
    body {
      font: 14px/1.6 "Microsoft YaHei", sans-serif;
      color: #6b5f52;
      user-select: none;
    }

    .compare {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      cursor: ew-resize;
    }

    .compare img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 左侧：女生，宽度由 --pos 控制 */
    .layer-girl {
      position: absolute;
      inset: 0;
      width: var(--pos, 50%);
      overflow: hidden;
      border-right: 0;
    }

    .layer-girl img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    .handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--pos, 50%);
      width: 2px;
      background: rgba(74, 61, 53, 0.55);
      transform: translateX(-1px);
    }

    .handle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fdf8ee;
      border: 2px solid rgba(74, 61, 53, 0.5);
      box-shadow: 0 4px 14px rgba(74, 61, 53, 0.22);
    }

    .handle::before {
      content: "⇄";
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      transform: translate(-50%, -52%);
      font-size: 18px;
      color: #4a3d35;
      pointer-events: none;
    }

    .tag {
      position: absolute;
      bottom: 26px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(253, 248, 238, 0.9);
      border: 1px solid rgba(74, 61, 53, 0.18);
      font-size: 13px;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .tag-girl { left: 26px; }
    .tag-boy { right: 26px; }

    .hint {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(253, 248, 238, 0.85);
      border: 1px solid rgba(74, 61, 53, 0.15);
      font-size: 12px;
      color: #8a7c6c;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="compare" id="compare">
    <img src="./backgrounds-painted/sleep-boy.jpg" alt="男生宿舍">
    <div class="layer-girl">
      <img src="./backgrounds-painted/sleep-girl.jpg" alt="女生宿舍">
    </div>
    <div class="handle" id="handle"></div>
    <span class="tag tag-girl">她 · 女生宿舍</span>
    <span class="tag tag-boy">他 · 男生宿舍</span>
    <span class="hint">左右拖动中间的圆点对比</span>
  </div>
  <script>
    (() => {
      const root = document.getElementById("compare");
      const handle = document.getElementById("handle");
      let dragging = false;

      const setPos = (clientX) => {
        const rect = root.getBoundingClientRect();
        const pct = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
        root.style.setProperty("--pos", `${pct}%`);
      };

      const start = (event) => {
        dragging = true;
        root.setPointerCapture?.(event.pointerId);
        setPos(event.clientX);
      };
      const move = (event) => {
        if (dragging) setPos(event.clientX);
      };
      const end = () => {
        dragging = false;
      };

      root.addEventListener("pointerdown", start);
      root.addEventListener("pointermove", move);
      root.addEventListener("pointerup", end);
      root.addEventListener("pointercancel", end);
      root.addEventListener("pointerleave", end);
      handle.addEventListener("pointerdown", start);

      // 键盘也能调
      window.addEventListener("keydown", (event) => {
        const pos = parseFloat(getComputedStyle(root).getPropertyValue("--pos")) || 50;
        if (event.key === "ArrowLeft") root.style.setProperty("--pos", `${Math.max(0, pos - 4)}%`);
        if (event.key === "ArrowRight") root.style.setProperty("--pos", `${Math.min(100, pos + 4)}%`);
      });
    })();
  </script>
</body>
</html>
